{% macro date_field(name, value) %}{% set raw = value or '' %}<span class="date-field"><input class="date-part" name="{{ name }}_day" type="text" inputmode="numeric" maxlength="2" placeholder="—" value="{{ raw[8:10] }}"><span class="date-sep" aria-hidden="true">/</span><input class="date-part" name="{{ name }}_month" type="text" inputmode="numeric" maxlength="2" placeholder="—" value="{{ raw[5:7] }}"><span class="date-sep" aria-hidden="true">/</span><input class="date-part" name="{{ name }}_year" type="text" inputmode="numeric" maxlength="4" placeholder="—" value="{{ raw[0:4] }}"><input type="hidden" name="{{ name }}" value="{{ raw }}"></span>{% endmacro %}
